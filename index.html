<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Тестовый Сайт</title>
    <style>
   body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Яркий, сочный фон */
    background: radial-gradient(circle at top right, #ff9a9e, #fad0c4 50%, #a18cd1);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.container {
    /* Главная магия Glassmorphism */
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    width: 320px;
}

h1 { color: white; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.5);
    outline: none;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: #ffffff;
    color: #6a11cb;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #6a11cb;
    color: white;
}

li {
    background: rgba(255, 255, 255, 0.3);
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    color: white;
    list-style: none;
    border-left: 5px solid #ff9a9e;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button onclick="addTask()">Добавить</button>
        <ul id="taskList"></ul>
    </div>
    <script src="index.js"></script>
</body>
</html>
